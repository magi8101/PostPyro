[package]
name = "PostPyro"
version = "1.0.0"
edition = "2021"
description = "Ultra-fast PostgreSQL driver for Python built with Rust - Binary protocol, prepared statements, thread-safe,tokio-postgres"
authors = ["Magi sharma J <sharmamagi0@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/magi8101/PostPyro"
repository = "https://github.com/magi8101/PostPyro"
keywords = ["postgresql", "database", "python", "pyo3", "async"]
categories = ["database", "api-bindings"]

[lib]
name = "PostPyro"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "bigdecimal"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
bigdecimal = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = false
debug = true